{% set name = "libcups" %}
{% set version = "2.4.15" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/OpenPrinting/cups/releases/download/v{{ version }}/cups-{{ version }}-source.tar.gz
  sha256: eff0bbd48ff1abcbb8e46e28e85aefaffa391a1d9c4d8dc92ab3822a13008d7f

build:
  number: 0
  skip: True                                      # [not linux]
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
  host:
    - zlib {{ zlib }}
    - openssl {{ openssl }}
  run:
    - {{ pin_compatible('zlib') }}
    - {{ pin_compatible('openssl') }}

test:
  commands:
    - test -f ${PREFIX}/lib/libcups${SHLIB_EXT}
    - test -f ${PREFIX}/include/cups/cups.h
    - test -x ${PREFIX}/bin/cups-config
    - cups-config --version

about:
  home: https://openprinting.github.io/cups
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: 'OpenPrinting CUPS is the standards-based, open source printing system'
  description: |
    OpenPrinting CUPS is the current standards-based, open source printing system developed by
    OpenPrinting for Linux® and other Unix®-like operating systems.
  doc_url: https://openprinting.github.io/cups/#DOCUMENTATION
  dev_url: https://github.com/OpenPrinting/cups

extra:
  recipe-maintainers:
    - isuruf
    - hmaarrfk
    - katietz
